[ContentBrowser]
ContentBrowserTab1.SelectedPaths=/Game/ThirdPersonCPP

; Multiplayer PIE defaults (milestone M0).
; Listen server + 2 client windows, so a 1 human : 1 toy match can be tested from the editor.
[/Script/UnrealEd.LevelEditorPlaySettings]
PlayNetMode=PIE_ListenServer
PlayNumberOfClients=2
RunUnderOneProcess=True
; Network emulation stays on at all times. Developing with it off hides bugs that
; always show up on real hardware.
; Outgoing only: 45-55 ms with 2% loss, which is roughly a 100 ms round trip.
; CurrentProfile must be "Custom" or the editor overwrites these numbers with a preset.
NetworkEmulationSettings=(bIsNetworkEmulationEnabled=True,EmulationTarget=Any,CurrentProfile="Custom",OutPackets=(MinLatency=45,MaxLatency=55,PacketLossPercentage=2),InPackets=(MinLatency=0,MaxLatency=0,PacketLossPercentage=0))
